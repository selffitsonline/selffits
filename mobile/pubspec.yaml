name: selffits_mobile
description: "SELFFITS Mobile Application - World-Class Live Martial Arts & Fitness Academy"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.jpg
    - assets/branding/Logo-selffits.png
    - assets/fonts/
    - assets/images/onboarding/
